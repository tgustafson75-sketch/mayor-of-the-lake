[package]
name = "mayor-of-the-lake"
version = "0.1.0"
description = "Mayor of the Lake: a Lake Elsinore city and politics sim"
edition = "2021"
rust-version = "1.77"

[lib]
name = "mayor_of_the_lake_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
